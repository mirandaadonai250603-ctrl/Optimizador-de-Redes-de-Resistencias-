<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optimizador de Redes de Resistencias - Future Frenzy</title>
    <style>
        :root {
            --bg-body: #3b3b3b;
            --bg-panel: #c6c6c6;
            --text-main: #ffffff;
            --text-dark: #222222;
            --btn-border-light: #e0e0e0;
            --btn-border-dark: #222222;
            --accent-splash: #ffff00;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', Courier, monospace; 
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 30px 10px;
            display: flex;
            justify-content: center;
            background-image: 
                linear-gradient(rgba(0,0,0,0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.3) 1px, transparent 1px);
            background-size: 32px 32px;
        }

        .app-container {
            max-width: 900px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
            padding-bottom: 40px;
        }

        .app-header {
            position: relative;
            text-align: center;
            padding-bottom: 15px;
            margin-bottom: 5px;
        }

        .app-header h1 {
            margin: 0;
            font-size: clamp(1.4rem, 4vw, 2.2rem);
            font-weight: 900;
            color: #e0e0e0;
            text-shadow: 3px 3px 0px #222;
            font-family: 'Impact', 'Arial Black', sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .app-header h2 {
            margin: 5px 0 0 0;
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            color: #bbbbbb;
            font-family: 'Courier New', monospace;
            font-weight: normal;
            letter-spacing: 1px;
        }

        .splash-text {
            position: absolute;
            right: 5%;
            bottom: -5px;
            color: var(--accent-splash);
            font-size: clamp(1rem, 2.5vw, 1.4rem);
            font-weight: bold;
            transform: rotate(-12deg);
            text-shadow: 2px 2px 0px #000;
            animation: minecraftPulse 0.5s infinite alternate ease-in-out;
            font-family: 'Courier New', monospace;
            z-index: 10;
        }

        @keyframes minecraftPulse {
            0% { transform: rotate(-12deg) scale(0.98); }
            100% { transform: rotate(-12deg) scale(1.15); }
        }

        .bottom-splash-container {
            text-align: right;
            padding-right: 20px;
            margin-top: -10px;
        }

        .bottom-splash {
            display: inline-block;
            color: var(--accent-splash);
            font-size: 1.3rem;
            font-weight: bold;
            transform: rotate(8deg);
            text-shadow: 2px 2px 0px #000;
            animation: bottomPulse 0.6s infinite alternate ease-in-out;
            font-family: 'Courier New', monospace;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .bottom-splash:hover {
            transform: rotate(8deg) scale(1.2);
            color: #00ffff;
        }

        @keyframes bottomPulse {
            0% { transform: rotate(8deg) scale(0.96); }
            100% { transform: rotate(8deg) scale(1.12); }
        }

        .module-card {
            background-color: var(--bg-panel);
            border: 4px solid var(--btn-border-light);
            border-right-color: var(--btn-border-dark);
            border-bottom-color: var(--btn-border-dark);
            box-shadow: inset -2px -2px 0px #444, inset 2px 2px 0px #fff;
            padding: 15px;
        }

        .module-header {
            background-color: #444;
            color: white;
            padding: 8px 15px;
            border: 2px solid #111;
            box-shadow: inset 2px 2px 0px #666;
            font-weight: bold;
            font-size: 1.05rem;
            margin-bottom: 15px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .controls-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
            margin-bottom: 10px;
            justify-content: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            color: var(--text-dark);
            font-weight: bold;
        }

        .control-group label {
            font-size: 0.85rem;
            text-transform: uppercase;
            text-shadow: 1px 1px 0px #fff;
        }

        input[type="text"], select {
            padding: 9px 12px;
            border: 2px solid #111;
            background-color: #000;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            font-weight: bold;
            outline: none;
            min-width: 220px;
            box-shadow: inset 2px 2px 0px #444;
        }

        select {
            color: #00ffff;
            cursor: pointer;
        }

        .btn {
            padding: 10px 18px;
            border: 2px solid var(--btn-border-dark);
            border-top-color: var(--btn-border-light);
            border-left-color: var(--btn-border-light);
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            text-shadow: 1px 1px 0px #000;
            box-shadow: inset 1px 1px 0px rgba(255,255,255,0.3), inset -1px -1px 0px rgba(0,0,0,0.5);
            transition: all 0.08s;
            text-transform: uppercase;
            color: white;
            background-color: #2a5278;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .btn:hover {
            filter: brightness(1.15);
            color: #ffff00;
        }

        .btn:active {
            border: 2px solid var(--btn-border-light);
            border-top-color: var(--btn-border-dark);
            border-left-color: var(--btn-border-dark);
            box-shadow: inset 2px 2px 0px rgba(0,0,0,0.6);
            transform: translateY(1px);
        }

        .screen-container {
            background-color: #000;
            border: 3px solid #222;
            border-right-color: #555;
            border-bottom-color: #555;
            padding: 10px;
            position: relative;
            box-shadow: inset 2px 2px 8px rgba(0,0,0,0.9);
            margin-top: 10px;
            width: 100%;
        }

        .output-area {
            width: 100%;
            height: 380px;
            background-color: #000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            padding: 10px;
            white-space: pre-wrap;
            overflow-y: auto;
            line-height: 1.4;
            border: none;
            outline: none;
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <header class="app-header">
        <h1>Optimizador de Redes de Resistencias</h1>
        <h2>Cálculo avanzado de arreglos comerciales Serie, Paralelo y Mixtos</h2>
        <div class="splash-text">Future Frenzy!</div>
    </header>

    <!-- MÓDULO DE ENTRADA -->
    <div class="module-card">
        <div class="module-header">Parámetros de Búsqueda</div>
        <div class="module-content">
            <div class="controls-row">
                <div class="control-group">
                    <label for="txtObjetivo">Valor Deseado (ej. 45817 o 45.817k):</label>
                    <input type="text" id="txtObjetivo" placeholder="45817" autofocus>
                </div>
                <div class="control-group">
                    <label for="comboTolerancia">Tolerancia (%):</label>
                    <select id="comboTolerancia">
                        <option value="1">1 (E24)</option>
                        <option value="10">10 (E12)</option>
                    </select>
                </div>
                <button id="btnCalcular" class="btn">⚡ Calcular Mejores Opciones</button>
            </div>
        </div>
    </div>

    <!-- MÓDULO DE RESULTADOS -->
    <div class="module-card">
        <div class="module-header">Top 3 Mejores Opciones Comerciales</div>
        <div class="module-content">
            <div class="screen-container">
                <div id="areaResultados" class="output-area">Introduce un valor deseado y presiona "Calcular Mejores Opciones"...</div>
            </div>
        </div>
    </div>

    <!-- SPLASH INFERIOR INTERactivo con enlace a NameMC -->
    <div class="bottom-splash-container">
        <a href="https://namemc.com/profile/ULTRAVC999.1" target="_blank" class="bottom-splash">ULTRAVC999!</a>
    </div>

</div>

<script>
    const SERIE_E12 = [1.0, 1.2, 1.5, 1.8, 2.2, 2.7, 3.3, 3.9, 4.7, 5.6, 6.8, 8.2];
    const SERIE_E24 = [
        1.0, 1.1, 1.2, 1.3, 1.5, 1.6, 1.8, 2.0, 2.2, 2.4, 2.7, 3.0,
        3.3, 3.6, 3.9, 4.3, 4.7, 5.1, 5.6, 6.2, 6.8, 7.5, 8.2, 9.1
    ];

    function construirCatalogo(baseSerie, decadas = 7) {
        let catalogo = new Set();
        for (let d = 0; d < decadas; d++) {
            for (let b of baseSerie) {
                catalogo.add(parseFloat((b * Math.pow(10, d)).toFixed(2)));
            }
        }
        return Array.from(catalogo).sort((a, b) => a - b);
    }

    function seleccionarSerieSegunTolerancia(tol) {
        if (tol >= 10) {
            return { inventario: construirCatalogo(SERIE_E12), etiqueta: "E12 (10%)" };
        } else {
            return { inventario: construirCatalogo(SERIE_E24), etiqueta: "E24 (1% / 5%)" };
        }
    }

    function formatearOhms(valor) {
        if (valor >= 1_000_000) {
            return (valor / 1_000_000).toString().replace(/\.?0+$/, '') + " MΩ";
        } else if (valor >= 1_000) {
            return (valor / 1_000).toString().replace(/\.?0+$/, '') + " kΩ";
        }
        return valor.toString() + " Ω";
    }

    function parsearEntrada(texto) {
        let limpio = texto.trim().toLowerCase().replace(',', '.').replace('ω', '').replace('ohm', '').trim();
        let multiplicador = 1.0;
        if (limpio.endsWith('k')) {
            multiplicador = 1000.0;
            limpio = limpio.slice(0, -1).trim();
        } else if (limpio.endsWith('m')) {
            multiplicador = 1000000.0;
            limpio = limpio.slice(0, -1).trim();
        }
        let val = parseFloat(limpio);
        if (isNaN(val)) throw new Error("Formato inválido");
        return val * multiplicador;
    }

    function evaluarTopologiasMixtas(x, y, z) {
        let coleccion = {};
        const trio = [[x, y, z], [y, x, z], [z, x, y]];
        for (let [focal, p_a, p_b] of trio) {
            let denominador = p_a + p_b + focal;
            if (denominador > 0) {
                let val = ((p_a + p_b) * focal) / denominador;
                let expr = `(${formatearOhms(p_a)} + ${formatearOhms(p_b)}) || ${formatearOhms(focal)}`;
                coleccion[expr] = { modo: "Serie-Paralelo", val };
            }
            if (p_a + p_b > 0) {
                let val = ((p_a * p_b) / (p_a + p_b)) + focal;
                let expr = `(${formatearOhms(p_a)} || ${formatearOhms(p_b)}) + ${formatearOhms(focal)}`;
                coleccion[expr] = { modo: "Paralelo-Serie", val };
            }
        }
        return Object.entries(coleccion).map(([formula, item]) => [item.modo, item.val, formula]);
    }

    function* combinationsWithReplacement(iterable, r) {
        const pool = Array.from(iterable);
        const n = pool.length;
        if (n === 0 && r > 0) return;
        let indices = new Array(r).fill(0);
        yield indices.map(i => pool[i]);
        while (true) {
            let i;
            for (i = r - 1; i >= 0; i--) {
                if (indices[i] !== n - 1) break;
            }
            if (i < 0) return;
            indices.fill(indices[i] + 1, i);
            yield indices.map(idx => pool[idx]);
        }
    }

    function buscarCombinacionesOptimas(meta, inventario, maxTol) {
        let hallazgos = [];
        let invFiltrado = inventario.filter(r => r >= (meta / 1000) && r <= (meta * 500));
        if (invFiltrado.length < 10) {
            invFiltrado = inventario;
        }

        for (let cantidad = 1; cantidad <= 3; cantidad++) {
            for (let combinacion of combinationsWithReplacement(invFiltrado, cantidad)) {
                // Serie
                let v_eq = combinacion.reduce((a, b) => a + b, 0);
                let error = (Math.abs(v_eq - meta) / meta) * 100;
                if (error <= maxTol) {
                    hallazgos.push({
                        modo: 'Serie',
                        formula: combinacion.map(el => formatearOhms(el)).join(' + '),
                        elementos: combinacion,
                        valor: parseFloat(v_eq.toFixed(3)),
                        error: parseFloat(error.toFixed(4)),
                        piezas: cantidad
                    });
                }

                // Paralelo
                if (cantidad > 1) {
                    let sumaInversos = combinacion.reduce((a, b) => a + (1.0 / b), 0);
                    if (sumaInversos > 0) {
                        v_eq = 1.0 / sumaInversos;
                        error = (Math.abs(v_eq - meta) / meta) * 100;
                        if (error <= maxTol) {
                            hallazgos.push({
                                modo: 'Paralelo',
                                formula: combinacion.map(el => formatearOhms(el)).join(' || '),
                                elementoss: combinacion,
                                elementos: combinacion,
                                valor: parseFloat(v_eq.toFixed(3)),
                                error: parseFloat(error.toFixed(4)),
                                piezas: cantidad
                            });
                        }
                    }
                }

                // Mixtas
                if (cantidad === 3) {
                    let mixtas = evaluarTopologiasMixtas(...combinacion);
                    for (let [modo, v_eq, formula] of mixtas) {
                        let error = (Math.abs(v_eq - meta) / meta) * 100;
                        if (error <= maxTol) {
                            hallazgos.push({
                                modo: modo,
                                formula: formula,
                                elementos: combinacion,
                                valor: parseFloat(v_eq.toFixed(3)),
                                error: parseFloat(error.toFixed(4)),
                                piezas: cantidad
                            });
                        }
                    }
                }
            }
        }

        let registrosUnicos = new Map();
        for (let h of hallazgos) {
            let llave = `${h.formula}_${h.valor}`;
            if (!registrosUnicos.has(llave)) {
                registrosUnicos.set(llave, h);
            }
        }

        let listaFinal = Array.from(registrosUnicos.values());
        listaFinal.sort((a, b) => a.error - b.error || a.piezas - b.piezas);
        return listaFinal.slice(0, 3);
    }

    function contarPiezas(elementos) {
        let conteo = {};
        for (let el of elementos) {
            conteo[el] = (conteo[el] || 0) + 1;
        }
        return conteo;
    }

    const txtObjetivo = document.getElementById('txtObjetivo');
    const comboTolerancia = document.getElementById('comboTolerancia');
    const btnCalcular = document.getElementById('btnCalcular');
    const areaResultados = document.getElementById('areaResultados');

    function ejecutarCalculo() {
        let valStr = txtObjetivo.value.trim();
        if (!valStr) {
            alert("Por favor ingresa un valor de resistencia válido.");
            return;
        }

        let meta;
        try {
            meta = parsearEntrada(valStr);
            if (meta <= 0) throw new Error();
        } catch (e) {
            alert("Introduce un número válido (ej. 45817, 45.817k o 4.55M).");
            return;
        }

        let tolerancia = parseFloat(comboTolerancia.value);
        btnCalcular.disabled = true;
        btnCalcular.innerText = "Calculando...";
        areaResultados.innerText = "⏳ Buscando las mejores combinaciones comerciales...";

        setTimeout(() => {
            let { inventario, etiqueta } = seleccionarSerieSegunTolerancia(tolerancia);
            let topTres = buscarCombinacionesOptimas(meta, inventario, tolerancia);

            let tolUsada = tolerancia;
            if (topTres.length === 0 && tolerancia < 5.0) {
                tolUsada = 5.0;
                topTres = buscarCombinacionesOptimas(meta, inventario, tolUsada);
            }

            btnCalcular.disabled = false;
            btnCalcular.innerText = "⚡ Calcular Mejores Opciones";

            if (topTres.length === 0) {
                areaResultados.innerText = `❌ No se encontraron combinaciones válidas dentro de la tolerancia del ${tolUsada}%.`;
                return;
            }

            let textoSalida = `Búsqueda exitosa en serie ${etiqueta} para ${formatearOhms(meta)} (${meta} Ω):\n`;
            textoSalida += `Mostrando los 3 mejores resultados optimizados:\n\n`;
            textoSalida += "=".repeat(68) + "\n";

            topTres.forEach((res, idx) => {
                textoSalida += `Opción #${idx + 1} | Topología: ${res.modo}\n`;
                textoSalida += ` • Expresión: ${res.formula}\n`;
                textoSalida += ` • Valor Equivalente: ${formatearOhms(res.valor)} (${res.valor} Ω)\n`;
                textoSalida += ` • Margen de Error: ${res.error.toFixed(4)} %\n`;
                textoSalida += ` 🛒 Lista de compras en tienda:\n`;

                let conteo = contarPiezas(res.elementos);
                Object.keys(conteo).sort((a, b) => parseFloat(a) - parseFloat(b)).forEach(ohm => {
                    textoSalida += `    - ${conteo[ohm]}x ${formatearOhms(parseFloat(ohm))}\n`;
                });
                textoSalida += "-".repeat(68) + "\n";
            });

            areaResultados.innerText = textoSalida;
        }, 50);
    }

    btnCalcular.addEventListener('click', ejecutarCalculo);
    txtObjetivo.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') ejecutarCalculo();
    });
</script>

</body>
</html>
